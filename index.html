<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thurin Docs</title>
  <meta name="description" content="Documentation for Thurin — Privacy-preserving identity verification">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://docs.thurin.id">
  <meta property="og:title" content="Thurin Docs">
  <meta property="og:description" content="Documentation for Thurin — Privacy-preserving identity verification. Proofs, smart contracts, and SDK reference.">
  <meta property="og:image" content="https://docs.thurin.id/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@thurinlabs">
  <meta name="twitter:title" content="Thurin Docs">
  <meta name="twitter:description" content="Documentation for Thurin — Privacy-preserving identity verification. Proofs, smart contracts, and SDK reference.">
  <meta name="twitter:image" content="https://docs.thurin.id/images/og-image.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.min.css">
  <style>
    :root {
      --theme-color: #7c9a3e;
      --base-background-color: #1a1a12;
      --sidebar-background: #1a1a12;
      --sidebar-nav-link-color--active: #7c9a3e;
      --sidebar-nav-link-border-color--active: #7c9a3e;
      --link-color: #7c9a3e;
      --code-inline-background: #2a2a1f;
    }
    /* Roadmap status badges */
    .status {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.7em;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      vertical-align: middle;
      padding: 2px 8px;
      margin-left: 8px;
      border: 1px solid currentColor;
      border-radius: 3px;
      background: color-mix(in srgb, currentColor 14%, transparent);
    }
    .status-shipped  { color: #8fbf4a; }
    .status-testnet  { color: #d9a441; }
    .status-progress { color: #5fa8e6; }
    .status-next     { color: #4fc1b5; }
    .status-designed { color: #9a9a8a; }
    table .status { margin-left: 0; }

    /* Roadmap checklists: big, colored boxes */
    .markdown-section li:has(> input[type="checkbox"]), .markdown-section li.task-list-item {
      list-style: none;
      position: relative;
      padding-left: 2em;
      margin: 0.45em 0;
    }
    .markdown-section li input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      position: absolute;
      left: 0;
      top: 0.15em;
      width: 1.25em;
      height: 1.25em;
      margin: 0;
      border: 2px solid #6b6b5c;
      border-radius: 4px;
      background: transparent;
      cursor: default;
    }
    .markdown-section li input[type="checkbox"]:checked {
      border-color: #8fbf4a;
      background: #8fbf4a;
    }
    .markdown-section li input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 0.32em;
      top: 0.08em;
      width: 0.35em;
      height: 0.7em;
      border: solid #1a1a12;
      border-width: 0 0.2em 0.2em 0;
      transform: rotate(45deg);
    }
    .markdown-section li:has(input:checked) { color: #d8d8c8; }
    .markdown-section li:has(input:not(:checked)) { color: #9a9a8a; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Thurin',
      repo: 'https://github.com/thurinlabs',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      // 2026-09: docs/scry/ became docs/guides/ (brand collapse). Keep old links alive.
      alias: {
        '/scry/(.*)': '/guides/$1',
      },
      requestHeaders: {
        'Cache-Control': 'no-cache',
      },
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-solidity.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
